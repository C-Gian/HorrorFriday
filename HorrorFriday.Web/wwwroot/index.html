<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HorrorFriday</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
    <style>
        /* Blazor WASM loading screen — shown while the runtime downloads */
        .blazor-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #0a0908;
            gap: 20px;
        }

        .blazor-loading-logo {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: #9b1c1c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, serif;
            font-size: 26px;
            font-weight: 700;
            color: #e8e0d4;
        }

        .blazor-loading-spinner {
            width: 28px;
            height: 28px;
            border: 2.5px solid #252321;
            border-top-color: #d44a4a;
            border-radius: 50%;
            animation: blazorSpin 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        @keyframes blazorSpin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="blazor-loading">
            <div class="blazor-loading-logo">H</div>
            <div class="blazor-loading-spinner"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // Google GSI internally calls navigator.permissions.query with wrong `this`,
        // causing "Illegal invocation". Patch both the instance and prototype to cover all paths.
        (function () {
            try {
                if (!navigator.permissions || !navigator.permissions.query) return;
                var bound = navigator.permissions.query.bind(navigator.permissions);
                // Try instance override first
                try { navigator.permissions.query = bound; } catch (_) {}
                // Then force via defineProperty on both instance and prototype
                try {
                    Object.defineProperty(navigator.permissions, 'query', {
                        value: bound, configurable: true, writable: true
                    });
                } catch (_) {}
                try {
                    var proto = Object.getPrototypeOf(navigator.permissions);
                    var orig = proto.query;
                    Object.defineProperty(proto, 'query', {
                        value: function (params) { return orig.call(navigator.permissions, params); },
                        configurable: true, writable: true
                    });
                } catch (_) {}
            } catch (_) {}
        })();
    </script>
    <script src="js/app.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="js/google-auth.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
